<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps for Carpool</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" type="module" defer></script>
</head>

<body>
    <div id="app-container">
        <div id="sidebar">
            <div class="header">
                <h1>Maps for Carpool</h1>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>

            <div class="input-group">
                <label for="start-container">Start Address</label>
                <div id="start-container" class="autocomplete-container"></div>
            </div>

            <div id="waypoints-container">
                <label>Intermediate Stops (Max 8)</label>
                <!-- Waypoint inputs will be added here -->
            </div>
            <button id="add-waypoint" class="secondary-btn">+ Add Stop</button>

            <div class="input-group">
                <label for="end-container">End Address</label>
                <div id="end-container" class="autocomplete-container"></div>
            </div>

            <button id="optimize-btn" class="primary-btn">Suggest Optimal Route</button>

            <div id="output-panel" class="hidden">
                <h3>Optimized Route</h3>
                <ol id="route-list"></ol>
            </div>
        </div>
        <div id="map"></div>
        <div id="total-info-card" class="total-info-card hidden">
            <div class="info-item">
                <span class="info-icon">📏</span>
                <span class="info-label">Total:</span>
                <span id="total-distance" class="info-value">--</span>
            </div>
            <div class="info-item">
                <span class="info-icon">⏱️</span>
                <span id="total-duration" class="info-value">--</span>
            </div>
        </div>
        <div id="savings-card" class="savings-card hidden">
            <div class="savings-grid">
                <div class="saving-item">
                    <span class="saving-icon">📏</span>
                    <span class="saving-value" id="distance-saved">--</span>
                    <span class="saving-label">Distance Saved</span>
                </div>
                <div class="saving-item">
                    <span class="saving-icon">⏱️</span>
                    <span class="saving-value" id="time-saved">--</span>
                    <span class="saving-label">Time Saved</span>
                </div>
                <div class="saving-item">
                    <span class="saving-icon">⛽</span>
                    <span class="saving-value" id="fuel-saved">--</span>
                    <span class="saving-label">Fuel Saved</span>
                </div>
                <div class="saving-item">
                    <span class="saving-icon">🌱</span>
                    <span class="saving-value" id="co2-saved">--</span>
                    <span class="saving-label">CO2 Reduced</span>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
